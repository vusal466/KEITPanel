spring:
  application:
    name: keitpanel
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: postgres
    password: PASSWORD
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
